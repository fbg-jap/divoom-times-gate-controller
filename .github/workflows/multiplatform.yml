name: Multiplatform builds
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-server.txt httpx pyinstaller
      - run: python -m unittest discover -s tests -t tests
      - run: python -m PyInstaller --noconfirm --distpath dist/windows packaging/DivoomKeeperStudio.spec
      - name: Package portable application
        shell: pwsh
        run: Compress-Archive -Path dist/windows/DivoomKeeperStudio -DestinationPath dist/DivoomKeeper-3.1.1-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: dist/DivoomKeeper-3.1.1-windows.zip
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 fonts-dejavu-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r requirements.txt -r requirements-server.txt httpx pyinstaller
      - run: python -m unittest discover -s tests -t tests
      - run: npm ci && npm test && npm run build
        working-directory: web
      - run: python -m PyInstaller --noconfirm --distpath dist/linux packaging/DivoomKeeperStudio.spec
      - run: tar -C dist/linux -czf dist/DivoomKeeperStudio-3.1.1-linux-x86_64.tar.gz DivoomKeeperStudio
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*.tar.gz
      - run: docker build -t keeper-ci .
      - name: Test Docker startup
        run: |
          docker run -d --name keeper-ci -p 18080:8080 keeper-ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz; then exit 0; fi
            sleep 2
          done
          docker logs keeper-ci
          exit 1
      - if: always()
        run: docker rm -f keeper-ci || true
  appimage:
    runs-on: ubuntu-22.04
    env:
      # Pinned releases with sha256 checksums (computed from the downloaded files). appimagetool would
      # otherwise fetch the rolling "continuous" runtime at build time, so the runtime is pinned and passed in.
      APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
      APPIMAGETOOL_SHA256: 46fdd785094c7f6e545b61afcfb0f3d98d8eab243f644b4b17698c01d06083d1
      APPIMAGE_RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
      APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libfontconfig1 libdbus-1-3 fonts-dejavu-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: bash build_linux.sh
        env:
          PYTHON: python3.12
      - name: Download appimagetool and runtime (pinned, checksum verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" "$APPIMAGETOOL_URL"
          echo "$APPIMAGETOOL_SHA256  $RUNNER_TEMP/appimagetool" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/appimagetool"
          curl -fsSL -o "$RUNNER_TEMP/runtime-x86_64" "$APPIMAGE_RUNTIME_URL"
          echo "$APPIMAGE_RUNTIME_SHA256  $RUNNER_TEMP/runtime-x86_64" | sha256sum -c -
      - run: bash packaging/build_appimage.sh
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool
          APPIMAGE_RUNTIME: ${{ runner.temp }}/runtime-x86_64
          APPIMAGE_EXTRACT_AND_RUN: '1'
      - name: Smoke test
        run: |
          shots="$(mktemp -d)"
          chmod +x dist/DivoomKeeperStudio-*.AppImage
          QT_QPA_PLATFORM=offscreen dist/DivoomKeeperStudio-*.AppImage --appimage-extract-and-run --demo --screenshot-dir "$shots"
          ls "$shots"
          test -n "$(find "$shots" -name '*.png' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage-x86_64
          path: dist/*.AppImage
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci && npm test && npm run build && npx cap sync android
        working-directory: web
      - run: bash web/android/gradlew -p web/android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: web/android/app/build/outputs/apk/debug/*.apk
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: xcodebuild -version
      - run: npm ci && npm run build && npx cap sync ios
        working-directory: web
      - name: Build unsigned simulator app (Xcode 26 required)
        run: xcodebuild -project web/ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-unsigned
          path: build/ios/Build/Products/Debug-iphonesimulator/App.app
