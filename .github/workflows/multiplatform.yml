name: Multiplatform builds
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-server.txt httpx pyinstaller
      - run: python -m unittest discover -s tests
      - run: python -m PyInstaller --noconfirm --distpath dist/windows packaging/DivoomKeeperStudio.spec
      - name: Package portable application
        shell: pwsh
        run: Compress-Archive -Path dist/windows/DivoomKeeperStudio -DestinationPath dist/DivoomKeeper-3.1.0-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: dist/DivoomKeeper-3.1.0-windows.zip
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 fonts-dejavu-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r requirements.txt -r requirements-server.txt httpx pyinstaller
      - run: python -m unittest discover -s tests
      - run: npm ci && npm test && npm run build
        working-directory: web
      - run: python -m PyInstaller --noconfirm --distpath dist/linux packaging/DivoomKeeperStudio.spec
      - run: tar -C dist/linux -czf dist/DivoomKeeperStudio-3.1.0-linux-x86_64.tar.gz DivoomKeeperStudio
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*.tar.gz
      - run: docker build -t keeper-ci .
      - name: Test Docker startup
        run: |
          docker run -d --name keeper-ci -p 18080:8080 keeper-ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz; then exit 0; fi
            sleep 2
          done
          docker logs keeper-ci
          exit 1
      - if: always()
        run: docker rm -f keeper-ci || true
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci && npm test && npm run build && npx cap sync android
        working-directory: web
      - run: bash web/android/gradlew -p web/android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: web/android/app/build/outputs/apk/debug/*.apk
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: xcodebuild -version
      - run: npm ci && npm run build && npx cap sync ios
        working-directory: web
      - name: Build unsigned simulator app (Xcode 26 required)
        run: xcodebuild -project web/ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-unsigned
          path: build/ios/Build/Products/Debug-iphonesimulator/App.app
